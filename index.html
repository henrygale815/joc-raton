<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14202c">
<title>Urmele lui Mișșișșippi</title>
<style>
:root{--card:#fdf6e3;--ink:#2b2118;--accent:#f4a259;--accent-d:#b9733a;--blue:#8ec5e8;--blue-d:#4f8db5;--good:#5fb36a;--bad:#e05a47;--muted:#7a6a58;--purple:#6b3fa0;--hand:"Noteworthy","Chalkboard SE","Comic Sans MS","Comic Neue",cursive}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 50% 0,#2f4a63,#14202c) fixed;font-family:"Trebuchet MS","Avenir Next",system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:16px;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#paws{position:fixed;inset:0;pointer-events:none;opacity:.2;transition:opacity 1.2s;overflow:hidden}
body.pawsy #paws{opacity:.36}
#paws svg{position:absolute;width:24px;height:29px;fill:#f6e7c8;opacity:0;animation:pawWalk 12s infinite}
@keyframes pawWalk{0%{opacity:0}2%{opacity:1}55%{opacity:1}65%{opacity:0}100%{opacity:0}}
/* ratonii */
.rac .tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.2s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
.rac .eyes{animation:shifty 3.4s ease-in-out infinite}
@keyframes shifty{0%,28%{transform:translateX(0)}34%,50%{transform:translateX(-3.5px)}56%,72%{transform:translateX(3.5px)}78%,100%{transform:translateX(0)}}
.rac .mo{display:none}.rac.laugh .mo{display:inline}.rac.laugh .mc{display:none}
.rac.laugh .bod{transform-box:fill-box;transform-origin:50% 100%;animation:giggle .3s ease-in-out infinite alternate}
@keyframes giggle{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-5px) rotate(3deg)}}
.hihi{font:bold 17px "Trebuchet MS",sans-serif;animation:hihi 1s ease-out infinite}
@keyframes hihi{0%{opacity:0;transform:translateY(6px)}30%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.zzz{font:bold 18px "Trebuchet MS",sans-serif;fill:#4f6d8f;animation:hihi 1.6s ease-out infinite}
.qsub{font-weight:normal;font-size:19px}
#app{position:relative;width:100%;max-width:720px}
#stickers{display:flex;gap:12px;justify-content:center;margin:4px 0 14px}
.st{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;filter:grayscale(1);opacity:.3;transition:.5s}
.st svg{width:38px;height:38px}
.st.on{filter:none;opacity:1;background:rgba(244,162,89,.35);transform:scale(1.08)}
.card{position:relative;background:var(--card);border-radius:26px;padding:24px;box-shadow:0 12px 34px rgba(0,0,0,.45);animation:pop .35s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
h1{font-size:30px;margin:0 0 6px}
p{font-size:22px;line-height:1.45;margin:10px 0}
.center{text-align:center}
.hand{font-family:var(--hand)}
.flash{font-size:19px;color:var(--muted);font-style:italic}
.say{background:#fff;border-radius:16px;padding:12px 16px;border-left:6px solid var(--accent);margin:10px 0}
.say p{margin:6px 0;font-size:21px}
.say b.timi{color:#2f6fb5}.say b.tomi{color:#c26a1b}.say b.ten{color:#8a4f8a}.say b.mis{color:var(--purple)}
.tracks{font-size:22px;background:#efe3c8;border-radius:14px;padding:10px 14px}
.scene{display:block;width:100%;height:auto;margin:4px 0 8px;border-radius:18px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.btns.one{grid-template-columns:1fr}
.btns.three{grid-template-columns:1fr 1fr 1fr}
button{font:inherit;font-size:21px;font-weight:bold;padding:16px 12px;border:0;border-radius:18px;background:var(--accent);color:var(--ink);box-shadow:0 5px 0 var(--accent-d);cursor:pointer;min-height:68px;touch-action:manipulation}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d)}
button.alt{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
button:disabled{opacity:.45}
button.wide{grid-column:1/-1}
button.spiral{grid-column:1/-1;font-size:28px;color:#fff;letter-spacing:2px;text-shadow:0 2px 3px rgba(0,0,0,.4);background:linear-gradient(90deg,#ff5f6d,#ffc371,#5fe08a,#47b5ff,#b06bff,#ff5f6d);background-size:300% 100%;box-shadow:0 5px 0 #6b3fa0;animation:rainbow 3s linear infinite,wobble .5s ease-in-out infinite}
button.spiral svg{width:30px;height:30px;vertical-align:middle;animation:spin 1.2s linear infinite}
button.jug{background:linear-gradient(90deg,#ff5fd2,#b06bff,#47b5ff);color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4);box-shadow:0 5px 0 #6b3fa0;font-size:24px;letter-spacing:1px}
button.jug.ready{animation:wobble .5s ease-in-out infinite}
button.jug:disabled{animation:none}
@keyframes rainbow{to{background-position:300% 0}}
@keyframes wobble{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) scale(1.02)}}
@keyframes spin{to{transform:rotate(360deg)}}
input{font:inherit;font-size:28px;width:100%;padding:14px 16px;border-radius:16px;border:3px solid var(--accent);margin-top:8px;text-align:center;-webkit-user-select:text;user-select:text}
/* scrisoarea */
.env{display:block;width:100%;max-width:360px;margin:0 auto;animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-4px)}}
.letter{position:relative;background:#fffaf0 repeating-linear-gradient(transparent 0 37px,#eadfc8 37px 39px);font-family:var(--hand);padding:14px 22px 18px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.18);transform:rotate(-.6deg);margin:6px 0}
.letter p{font-size:21px;line-height:39px;margin:0}
.letter .ink{color:var(--purple);font-weight:bold;animation:inkIn .9s}
.letter .huge{font-size:46px;line-height:64px;text-align:center}
@keyframes inkIn{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:none}}
.letter input{font-family:var(--hand);border:0;border-bottom:3px dashed var(--accent-d);border-radius:0;background:transparent;margin:0 0 6px;padding:4px;font-size:30px}
.sign{text-align:right}
.sign svg{width:28px;height:34px;fill:#5b3a1e;vertical-align:middle}
/* cufere */
.chests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.chestbtn{background:#fff;border-radius:18px;padding:30px 6px 10px;text-align:center;font-weight:bold;font-size:19px;box-shadow:0 5px 0 #d8c9a8;cursor:pointer}
.chestbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #d8c9a8}
.chestbtn.off{opacity:.4;pointer-events:none}
.chestsvg{display:block;width:100%;height:auto;overflow:visible}
.chestsvg .lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.chestsvg .contents{opacity:0;transition:opacity .5s .25s,transform .6s .25s}
.chestsvg.open .lid{transform:translate(-22px,-34px) rotate(-24deg)}
.chestsvg.open .contents{opacity:1;transform:translateY(-12px)}
.chestsvg.tap{animation:shake .35s}
.bigchest{width:60%;max-width:260px;margin:30px auto 0;cursor:pointer;animation:glowp 1.2s ease-in-out infinite}
@keyframes glowp{50%{filter:drop-shadow(0 0 18px #ffd166) drop-shadow(0 0 6px #fff3b0)}}
.loot{--r:#9aa0a6;display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:8px 12px;margin:8px 0;border:3px solid var(--r);opacity:0;animation:lootIn .5s forwards;font-size:20px;font-weight:bold}
.loot svg{width:44px;height:44px;flex:none}
.loot small{display:block;color:var(--r);font-size:14px;text-transform:uppercase;letter-spacing:2px}
.loot.leg{background:#fff8e1;box-shadow:0 0 18px #ffb300}
@keyframes lootIn{from{opacity:0;transform:translateX(-30px) scale(.9)}to{opacity:1;transform:none}}
.later{animation:lootIn .6s both}
/* râul */
#river .stone{cursor:pointer;transform-box:fill-box;transform-origin:center}
#river .stone.done ellipse.top{fill:#8fbf6a}
#river .stone.future{opacity:.5;pointer-events:none}
#river .stone.past{opacity:.6;pointer-events:none}
#river .stone.sunk{opacity:.25;pointer-events:none}
#river .stone.cur ellipse.top{stroke:#ffd166;stroke-width:5}
.riddle{display:block;font-size:30px;font-weight:bold;text-align:center;margin-top:4px}
#river .stone.sink{animation:sink .6s}
@keyframes sink{40%{transform:translateY(8px) scale(.9)}}
#river .ripple{fill:none;stroke:#fff;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:ripple .8s forwards;pointer-events:none}
@keyframes ripple{from{transform:scale(.4);opacity:1}to{transform:scale(2.4);opacity:0}}
#me{transition:transform .4s cubic-bezier(.4,1.8,.6,1)}
/* tastatura */
.keyshow{font-size:46px;font-weight:bold;letter-spacing:10px;text-align:center;background:#1d2b3a;color:#7cfc9a;border-radius:14px;padding:6px;min-height:72px;font-family:"Courier New",monospace}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.keypad button{min-height:62px;font-size:28px;padding:8px}
/* lupta */
.bar{height:22px;border-radius:12px;background:#e2d6bd;overflow:hidden;margin:4px 0 10px}
.bar>i{display:block;height:100%;transition:width .5s}
.hp-label{font-size:18px;font-weight:bold;display:flex;justify-content:space-between}
.arena{position:relative;height:226px}
#boss{display:block;margin:0 auto;width:220px;height:220px;animation:bob 2s ease-in-out infinite}
#boss.angry{filter:drop-shadow(0 0 14px #ff3b30);animation-duration:.8s}
#boss.hit{animation:shake .4s}
#boss.attack{animation:lunge .5s}
#boss.spin{animation:spin360 .8s}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes shake{20%{transform:translateX(-12px) rotate(-4deg)}40%{transform:translateX(12px) rotate(4deg)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes lunge{50%{transform:scale(1.15) translateY(10px)}}
@keyframes spin360{to{transform:rotate(360deg) scale(1.1)}}
.warn{background:#fff3cd;border:3px solid #e0a800;border-radius:16px;padding:10px 14px;font-size:20px;margin:8px 0;animation:pulse 1.2s ease-in-out infinite}
.warn small{display:block;color:var(--muted);font-size:17px;margin-top:4px}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(224,168,0,.25)}}
#log{min-height:96px}
#log p{font-size:20px;margin:6px 0}
.fxt{position:absolute;top:30%;transform:translateX(-50%);font-size:34px;font-weight:900;white-space:nowrap;text-shadow:0 3px 0 #fff,0 0 8px #fff;pointer-events:none;animation:floatUp 1.3s ease-out forwards;z-index:3}
@keyframes floatUp{from{opacity:0;margin-top:20px}15%{opacity:1}to{opacity:0;margin-top:-80px}}
.beam{position:absolute;top:72px;width:12px;height:0;border-radius:6px;background:linear-gradient(#ff3b30,#ffd166);box-shadow:0 0 18px 4px #ff3b30;transform-origin:top center;animation:beam .7s ease-out forwards;z-index:2}
.beam.mega{width:26px;background:linear-gradient(#b06bff,#ff5fd2);box-shadow:0 0 30px 8px #b06bff}
@keyframes beam{0%{height:0;opacity:1}55%{height:440px;opacity:1}100%{height:440px;opacity:0}}
.proj{position:absolute;top:110px;left:calc(50% - 18px);width:36px;height:36px;z-index:2;animation:fly .8s ease-in forwards}
.proj svg{width:100%;height:100%}
@keyframes fly{to{transform:translate(var(--dx),330px) rotate(600deg);opacity:.3}}
.proj.back{animation:flyback 1s ease-in-out forwards}
@keyframes flyback{50%{transform:translate(var(--dx),200px) rotate(300deg)}100%{transform:translate(0,-10px) rotate(700deg);opacity:0}}
.proj.fist{width:64px;height:64px;left:calc(50% - 32px);top:90px;animation:punch .7s ease-in forwards}
.proj.fist.back{animation:punchback 1s ease-in-out forwards}
@keyframes punch{to{transform:translateY(160px) scale(3.4);opacity:.5}}
@keyframes punchback{45%{transform:translateY(120px) scale(2.6)}100%{transform:translateY(-20px) scale(.6);opacity:0}}
.sweep{position:absolute;bottom:4px;left:-45%;width:45%;height:30px;border-radius:15px;background:repeating-linear-gradient(90deg,#6b737c 0 14px,#2b2118 14px 24px);animation:sweep .75s ease-in forwards;z-index:2}
@keyframes sweep{to{left:105%}}
.scream{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:36px;font-weight:900;color:#e05a47;text-shadow:0 3px 0 #fff;animation:scream .9s;z-index:2}
@keyframes scream{0%,100%{transform:scale(.6)}20%,60%{transform:scale(1.15) rotate(-3deg)}40%,80%{transform:scale(1.1) rotate(3deg)}}
.card.ouch{animation:ouch .4s}
@keyframes ouch{30%{background:#ffd2c9}}
/* efecte pe tot ecranul */
.card.quake{animation:quake .25s infinite}
@keyframes quake{25%{transform:translate(-7px,3px) rotate(-1deg)}75%{transform:translate(7px,-3px) rotate(1deg)}}
.card.fall{animation:fallaway 1.1s ease-in forwards}
@keyframes fallaway{to{transform:translateY(130vh) rotate(25deg)}}
.card.spin{animation:spinout 1s ease-in-out}
@keyframes spinout{50%{transform:rotate(360deg) scale(.5)}100%{transform:rotate(720deg) scale(1)}}
#dark{position:fixed;inset:0;background:#05080c;opacity:0;pointer-events:none;transition:opacity .6s;z-index:9}
body.dark #dark{opacity:.94}
#over{position:fixed;inset:0;pointer-events:none;z-index:10;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bigtxt{position:absolute;font-size:68px;font-weight:900;color:#fff;text-align:center;text-shadow:0 5px 0 #6b3fa0,0 0 24px rgba(0,0,0,.6);animation:boom 1.4s ease-out forwards}
.bigtxt.fallt{animation:falltxt 1.5s ease-in forwards}
@keyframes falltxt{from{transform:translateY(-45vh) rotate(-6deg)}to{transform:translateY(60vh) rotate(8deg)}}
.flashov{position:fixed;inset:0;pointer-events:none;z-index:11;animation:flashov .5s forwards}
@keyframes flashov{from{opacity:.9}to{opacity:0}}
.leaf{position:fixed;top:-20px;width:18px;height:11px;border-radius:50% 0;pointer-events:none;z-index:12;animation:fall linear forwards}
.burst{display:block;width:280px;height:280px;margin:0 auto;animation:boom 1s ease-out}
@keyframes boom{0%{transform:scale(.2);opacity:0}40%{transform:scale(1.4);opacity:1}100%{transform:scale(1)}}
.runbox{overflow:hidden;height:170px;position:relative}
.runner{position:absolute;left:calc(50% - 65px);width:130px}
.runner.go{animation:run 2.4s ease-in forwards}
@keyframes run{0%{transform:translateX(0)}20%{transform:translateX(-30px) rotate(-10deg)}100%{transform:translateX(900px) rotate(20deg)}}
.note{background:#fffaf0;border-radius:10px;padding:12px 16px;box-shadow:0 4px 14px rgba(0,0,0,.18);transform:rotate(1deg);font-family:var(--hand)}
.code{font-size:88px;font-weight:bold;letter-spacing:18px;text-align:center;color:var(--purple);background:#fff;border-radius:20px;padding:10px 0 10px 18px;margin:10px 0;animation:boom .8s ease-out;font-family:"Trebuchet MS",sans-serif}
.confetti{position:fixed;top:-20px;font-size:28px;pointer-events:none;animation:fall linear forwards;z-index:12}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
footer{text-align:center;margin-top:18px}
footer button{background:transparent;box-shadow:none;color:rgba(255,255,255,.35);font-size:15px;min-height:0;padding:6px}
@media (max-width:480px){.card{padding:18px}p{font-size:20px}button{font-size:19px}.code{font-size:64px;letter-spacing:10px}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="paw" viewBox="0 0 40 48"><ellipse cx="20" cy="33" rx="10.5" ry="11.5"/><ellipse cx="5.5" cy="21" rx="3.4" ry="6.5" transform="rotate(-35 5.5 21)"/><ellipse cx="12" cy="11" rx="3.4" ry="7.5" transform="rotate(-14 12 11)"/><ellipse cx="20" cy="7.5" rx="3.4" ry="7.5"/><ellipse cx="28" cy="11" rx="3.4" ry="7.5" transform="rotate(14 28 11)"/><ellipse cx="34.5" cy="21" rx="3.4" ry="6.5" transform="rotate(35 34.5 21)"/></symbol>
    <symbol id="sock" viewBox="0 0 40 54"><g stroke="#2b2118" stroke-width="2.5" stroke-linejoin="round"><path d="M10 2 H28 V30 Q28 36 34 40 Q40 46 34 50 Q28 53 20 48 L8 40 Q4 37 6 30 Z" fill="#fff"/><path d="M10 9 H28 M10 17 H28 M10 25 H28" stroke="#e05a47" stroke-width="4"/></g></symbol>
    <linearGradient id="rb" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff5f6d"/><stop offset=".3" stop-color="#ffc371"/><stop offset=".55" stop-color="#5fe08a"/><stop offset=".8" stop-color="#47b5ff"/><stop offset="1" stop-color="#b06bff"/></linearGradient>

<script>
// ====== SETĂRI ======
const NUME_ACCEPTATE = ['david', 'davi'];
const COD_LACAT = '8888';
const NUMAR_PREFERAT = '8';
const RATON = 'Credibilul Raton Mișșișșippi';
// ====================

const SAVE_KEY = 'misi-joc-v2';
let S = fresh();
function fresh() { return { stage: 'intro', name: 'David', stickers: [] }; }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const x = JSON.parse(localStorage.getItem(SAVE_KEY)); if (x && x.stage) S = Object.assign(fresh(), x); } catch (e) {} }

const card = document.getElementById('card');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const NAME = () => esc(S.name);

// ---------- sunete ----------
let AC;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d = .12, type = 'sine', vol = .2, delay = 0, slide) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d = .3, vol = .3, type = 'lowpass', f0 = 1000, f1 = 0, delay = 0) {
  const a = ac(); if (!a) return;
  const b = a.createBuffer(1, Math.floor(a.sampleRate * d), a.sampleRate), x = b.getChannelData(0);
  for (let i = 0; i < x.length; i++) x[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + delay;
  s.buffer = b; f.type = type; f.frequency.setValueAtTime(f0, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
const SFX = {
  click: () => tone(600, .06, 'square', .08),
  crunch: () => { noise(.09, .35, 'bandpass', 2600); noise(.09, .35, 'bandpass', 2000, 0, .17); },
  paper: () => { noise(.18, .25, 'highpass', 3000); noise(.14, .2, 'highpass', 4000, 0, .2); },
  wrong: () => tone(300, .35, 'sawtooth', .12, 0, 120),
  good: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .18, 'triangle', .2, i * .1)),
  boing: () => tone(200, .5, 'sine', .3, 0, 900),
  clack: () => { tone(160, .1, 'square', .3); noise(.15, .5, 'highpass', 1500); },
  whistle: () => tone(1500, 1.4, 'sine', .22, 0, 160),
  thud: () => { tone(110, .4, 'sine', .7, 0, 35); noise(.35, .6, 'lowpass', 700, 80); },
  rustle: () => { noise(.5, .3, 'bandpass', 3000, 1200); },
  chatter: () => { for (let i = 0; i < 6; i++) tone(900 + Math.random() * 700, .06, 'triangle', .12, i * .08); },
  hop: () => tone(320, .16, 'sine', .25, 0, 760),
  splash: () => { noise(.7, .55, 'lowpass', 3500, 250); tone(500, .2, 'sine', .15, 0, 150); },
  creak: () => { tone(95, 1.1, 'sawtooth', .07, 0, 60); tone(140, .8, 'sawtooth', .04, .2, 90); },

function mazeScene(track, spiral) {
  const C = 60, hedge = [], open = new Set(['2,2', '2,1', '2,0', '2,3', '2,4', '1,2', '0,2', '3,2', '4,2']);
  for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) {

    if ((Math.abs(x - 2) <= 1 && Math.abs(y - 2) <= 1) || Math.random() < .78) hedge.push([x, y]);
  }
  let s = '<svg class="scene" viewBox="0 0 300 300"><rect width="300" height="300" fill="#dcc89c"/>';
  for (let i = 0; i < 80; i++) s += `<circle cx="${(Math.random() * 300).toFixed(0)}" cy="${(Math.random() * 300).toFixed(0)}" r="${(1 + Math.random() * 1.6).toFixed(1)}" fill="#bea676"/>`;

  hedge.forEach(([x, y]) => {
    s += `<rect x="${x * C}" y="${y * C}" width="${C}" height="${C}" rx="14" fill="#3e8a3a"/>`;
    for (let i = 0; i < 6; i++) s += `<circle cx="${x * C + 10 + Math.random() * 40}" cy="${y * C + 10 + Math.random() * 40}" r="${6 + Math.random() * 7}" fill="${pick(['#4f9e45', '#357a31', '#5aab4e', '#2f6e2c'])}"/>`;
  });
  const D = { inainte: [0, -1], inapoi: [0, 1], stanga: [-1, 0], dreapta: [1, 0] };
  const others = Object.keys(D).filter(k => k !== track);
  // urme vechi, șterse, peste tot
  others.forEach(k => s += trail(150 + D[k][0] * 26, 150 + D[k][1] * 26, D[k][0], D[k][1], 6, 21, { op: .22, s: .7 }));
  // urme proaspete spre direcția bună
  s += trail(150 + D[track][0] * 24, 150 + D[track][1] * 24, D[track][0], D[track][1], 7, 19, { fill: '#4a2a10' });
  // șoseta
  const sk = D[pick(others)];
  const sx = 150 + sk[0] * 92 + sk[1] * 14, sy = 150 + sk[1] * 92 + sk[0] * 14;
  s += `<use href="#sock" x="${sx - 13}" y="${sy - 17}" width="26" height="34" transform="rotate(${rnd(-60, 60)} ${sx} ${sy})"/>`;
  if (spiral) s += `<circle cx="90" cy="90" r="29" fill="#fff6d8" stroke="#2b2118" stroke-width="3"/><g transform="translate(90 90)"><path d="${SPIRAL}" fill="none" stroke="url(#rb)" stroke-width="5" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/></path></g>`;
  s += '<g transform="translate(150 150)"><circle r="14" fill="rgba(200,230,255,.75)" stroke="#2b2118" stroke-width="5"><animate attributeName="r" values="13;16;13" dur="1.4s" repeatCount="indefinite"/></circle><line x1="11" y1="11" x2="24" y2="24" stroke="#2b2118" stroke-width="8" stroke-linecap="round"/></g>';
  return s + '</svg>';
}

function pawLayer() {

  const W = innerWidth, H = innerHeight, NS = 'http://www.w3.org/2000/svg';
  for (let t = 0; t < 14; t++) {
    const e = t % 4;
    let x = e === 1 ? -20 : e === 3 ? W + 20 : Math.random() * W, y = e === 0 ? H + 20 : e === 2 ? -20 : Math.random() * H;
    let ang = [-Math.PI / 2, 0, Math.PI / 2, Math.PI][e] + (Math.random() - .5) * .9;
    for (let i = 0; i < 70; i++) {
      ang += (Math.random() - .5) * .3;
      x += Math.cos(ang) * 34; y += Math.sin(ang) * 34;
      if (x < -40 || x > W + 40 || y < -40 || y > H + 40) break;
      const side = i % 2 ? 1 : -1, el = document.createElementNS(NS, 'svg');
      el.setAttribute('viewBox', '0 0 40 48'); el.innerHTML = '<use href="#paw"/>';
      el.style.left = (x - Math.sin(ang) * 9 * side - 12) + 'px'; el.style.top = (y + Math.cos(ang) * 9 * side - 14) + 'px';
      el.style.transform = `rotate(${(ang * 180 / Math.PI + 90).toFixed(0)}deg)`;
      el.style.animationDelay = (t * .9 + i * .2).toFixed(2) + 's';
      L.appendChild(el);
    }
  }
}

// ---------- 3. RÂUL CU PIETRE ----------
// ghicitori pentru râu (nivel 7-8 ani)
const RIDDLES = {
  add: () => { const x = rnd(5, 9), y = rnd(4, 9); return [`${x} + ${y} = ?`, x + y]; },
  sub: () => { const x = rnd(11, 18), y = rnd(3, 9); return [`${x} − ${y} = ?`, x - y]; },
  seq: () => { const k = pick([2, 3, 5, 10]), s0 = k === 10 ? 10 * rnd(1, 4) : rnd(1, 6); return [`${s0}, ${s0 + k}, ${s0 + 2 * k}, ... ce urmează?`, s0 + 3 * k]; },
  double: () => { const x = rnd(4, 9); return [`De două ori ${x} = ?`, 2 * x]; },
  legs: () => { const [t, k] = pick([['ratoni', 4], ['păsări', 2], ['păianjeni', 8], ['pisici', 4]]), n = k === 8 ? 2 : rnd(2, 4); return [`Câte picioare au ${n} ${t}?`, n * k]; },
  half: () => { const x = 2 * rnd(4, 9); return [`Jumătate din ${x} = ?`, x / 2]; },
  ten: () => { const x = rnd(2, 8); return [`${x} + ? = 10`, 10 - x]; },
};
function makeRow(type) {
  const [q, a] = RIDDLES[type]();
  const wrong = shuffle([a - 1, a + 1, a - 2, a + 2, a + 10].filter(n => n > 0 && n !== a)).slice(0, 2);
  const xs = shuffle([82, 200, 318]).map(x => x + rnd(-16, 16));
  return { q, a, opts: shuffle([a, ...wrong]), xs, sunk: [] };
}
function river() {
  if (!S.rv || !S.rv.rows) { S.rv = { row: 0, rows: shuffle(Object.keys(RIDDLES)).slice(0, 5).map(makeRow) }; save(); }
  show({
    title: 'Râul cu Pietre',
    text: ['Ca să treci râul, sari <b>rând cu rând</b>, de la malul tău până pe celălalt mal. Pe fiecare rând, doar o piatră e sigură: cea cu <b>răspunsul corect</b>!', riverScene(),
      `<p class="tracks" id="rmsg">${riverTask()}</p>`],
    after: c => c.querySelector('#river').onclick = e => { const g = e.target.closest('.stone'); if (g) stone(g); },
  });
}
function riverTask(pre = '') {
  const R = S.rv, row = R.rows[R.row];
  return `${pre}Rândul ${R.row + 1} din ${R.rows.length}:<span class="riddle">${row.q}</span>`;
}
let hopping = false;
async function stone(g) {
  const R = S.rv, r = +g.dataset.r, n = +g.dataset.n, row = R.rows[R.row], msg = document.getElementById('rmsg');
  if (hopping || r !== R.row || row.sunk.includes(n)) return;
  const x = row.xs[row.opts.indexOf(n)], y = ROW_Y[r];
  if (n !== row.a) {
    SFX.splash(); row.sunk.push(n); save();
    g.classList.replace('cur', 'sunk');
    g.parentNode.insertAdjacentHTML('beforeend', `<circle class="ripple" cx="${x}" cy="${y}" r="24"/>`);
    msg.innerHTML = riverTask(`<b>PLEOSC!</b> ${n} nu e răspunsul, piatra s-a scufundat! `);
    return;
  }
  SFX.hop(); R.row++; save();
  card.querySelector('#river').outerHTML = riverScene();
  card.querySelector('#river').onclick = e => { const gg = e.target.closest('.stone'); if (gg) stone(gg); };
  if (R.row < R.rows.length) { msg.innerHTML = riverTask(`${pick(['Hop!', 'Țup!', 'Bravo!', 'Super!'])} `); return; }
  hopping = true; msg.innerHTML = '<b>Ai ajuns pe malul celălalt!</b>';
  await wait(700); SFX.good(); giveSticker('rau');
  await wait(1000); hopping = false; go('door');
}

function door(reply, dead) {
  S.dr = S.dr || { tries: 0 }; let code = '';
  const intro = say([['ten', '«S-s-stai! Eu sunt Tenneșșee, pârșul de pază al lui Mișșișșippi. *cască* Ușa asta se deschide doar cu NUMĂRUL PREFERAT al lui Mișșișșippi.»'],

  }[n] || pick([`«${n}? Nu. Nu e ăla. Gândește-te la un om de zăpadă!»`, `«${n}? Hmm, ${n} nu are două burți.»`]);

      lines.push(`${at.hit} <b>−${d}</b>`);

    b.angry = true; await wait(700);
    SFX.alarm(); bigText('ROBOTUL SE ÎNFURIE!'); document.getElementById('boss').classList.add('angry');
    lines.push('<b>Robotul se înfurie!</b> Îi iese abur din urechi și lovește mai tare. Are atacuri noi!'); log(lines);
  }
  const pool = Object.keys(ATTACKS).filter(x => (b.angry || (x !== 'mega' && x !== 'pumn')) && x !== b.next);
  b.last = b.next; b.next = pick(pool);
  save(); renderWarn(); SFX.alarm();
  busy = false; buttonsState();
}
async function victory() {
  busy = true;
  if (document.getElementById('boss')) {
    buttonsState(); document.getElementById('warn').innerHTML = '';
    log(['Robotul scârțâie... scoate scântei... ochii clipesc nebunește... «EROARE! EROARE! PREA MULT GÂDILAT!»']);
    for (let i = 0; i < 3; i++) { anim('hit'); SFX.laser(); floatTxt(pick(['ZZT!', 'BZZ!', 'PFF!']), '#e0a800'); await wait(550); }
  }
  flashScreen('#fff'); SFX.boom();
  show({ text: [BURST, '<h1 class="center">BUUUUM!</h1>'] });
  await wait(2000);
  show({
    text: [`<div class="runbox"><svg class="runner" id="runner" viewBox="0 0 120 150">${raccoon(0, 0, 120, { messy: true })}</svg></div>`,
      `<p>Din fum iese un raton <b>CIUFULIT</b>, cu blana zbârlită și mustățile strâmbe. E chiar el, ${RATON}!</p>`,
      say([['mis', `«Bine, bine, m-ai bătut de data asta, detective ${NAME()}! Dar tot nu mă prinzi!»`]])],
    buttons: [{ t: 'Prinde-l!', f: catchHim, c: 'wide' }],
  });
  busy = false;
}
async function catchHim() {
  card.querySelector('button').disabled = true;
  SFX.whoosh(); document.getElementById('runner').classList.add('go');
  await wait(2300);
  S.stage = 'end'; save();
  end('Prea târziu! Ratonul a zbughit-o, lăsând în urmă doar urme de lăbuțe... și un cufăr!');
}

// ---------- 6. CUFĂRAȘUL ----------
const LOOT = [
  ['Comun', '#8d949a', 'Șoseta cu dungi din labirint', '<svg viewBox="0 0 40 54"><use href="#sock"/></svg>'],
  ['Rar', '#2f7de1', 'Capacul de oală al detectivului', '<svg viewBox="0 0 44 44"><ellipse cx="22" cy="26" rx="19" ry="10" fill="#c9d1d9" stroke="#2b2118" stroke-width="3"/><rect x="17" y="10" width="10" height="8" rx="3" fill="#2b2118"/></svg>'],
  ['Epic', '#9b4de0', 'Antena lui Mecha-Mișșișșippi', '<svg viewBox="0 0 44 44"><line x1="22" y1="42" x2="22" y2="14" stroke="#2b2118" stroke-width="4"/><circle cx="22" cy="10" r="7" fill="#e05a47" stroke="#2b2118" stroke-width="3"/></svg>'],
];
function end(msg) {
  let opened = false;
  const open = async () => {
    if (opened) return; opened = true;
    card.querySelector('button').disabled = true;
    const svg = document.querySelector('#chest svg');
    SFX.creak(); svg.classList.add('open'); flashScreen('#fff3b0'); bigText('LOOT!');
    await wait(1300); openChest();
  };
  show({
    text: [`<p>${msg || 'Ratonul a fugit și a lăsat în urmă un cufăr...'}</p>`, `<div class="bigchest" id="chest">${chestSVG('#9b6a3c', IN_NOTE)}</div>`,
      '<p class="center"><b>Un cufăr plin cu LOOT!</b></p>'],
    buttons: [{ t: 'Deschide LOOT-ul!', f: open, c: 'wide' }],
    after: () => { document.getElementById('chest').onclick = open; },
  });
}
function openChest() {
  S.stage = 'code'; save();
  SFX.win(); giveSticker('boss'); confetti();
  const items = LOOT.map(([r, c, t, ic], i) => `<div class="loot" style="--r:${c};animation-delay:${i * .5}s">${ic}<div><small>${r}</small>${t}</div></div>`).join('');
  show({
    title: 'LOOT!',
    text: [items,
      `<div class="loot leg" style="--r:#e08a00;animation-delay:1.6s"><svg viewBox="0 0 44 44"><rect x="8" y="6" width="28" height="32" rx="3" fill="#fffaf0" stroke="#2b2118" stroke-width="3" transform="rotate(6 22 22)"/><text x="22" y="29" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b3fa0">8888</text></svg><div><small>Legendar</small>Bilețelul secret al lui Mișșișșippi</div></div>`,
      `<div class="code" style="animation-delay:2.2s;animation-fill-mode:both">${COD_LACAT}</div>`,
      `<div class="later" style="animation-delay:2.6s"><p class="center"><b>Acesta e codul pentru lacăt! Bravo, detective ${NAME()}!</b></p>
<div class="note"><p>Pe bilețel, cu scris de raton: «Și mie îmi place cifra 8. Are două burți. — M.» ${PAW_ICON.replace('<svg', '<svg style="width:26px;height:31px;fill:#5b3a1e;vertical-align:middle"')}</p></div></div>`],
    buttons: [{ t: 'Mai multe confetti!', f: () => { SFX.win(); confetti(); }, c: 'wide' }],
  });
}
function confetti() {
  const em = ['🎉', '⭐', '🎊', '8️⃣', '🐾', '✨'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti'; c.textContent = pick(em);
    c.style.left = Math.random() * 100 + 'vw';
    c.style.animationDuration = 2 + Math.random() * 2.5 + 's';
    c.style.animationDelay = Math.random() * .8 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }
}

// ---------- pornire ----------
const SCENES = {
  intro, letter: () => letter(), maze: () => maze(), out: outMaze, twins, tquiz: () => tquiz(), map, river, door: () => door(), boss, end: () => end(), code: openChest,
};
document.getElementById('reset').onclick = () => {
  if (confirm('Începi jocul de la început?')) { busy = false; hopping = false; S = fresh(); save(); renderStickers(); go('intro'); }
};
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(pawLayer, 300); });
load(); renderStickers(); pawLayer(); setPaws();
(SCENES[S.stage] || intro)();
</script>
