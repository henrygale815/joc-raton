<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un mesaj de la Mișșișșippi</title>
<!-- Pagina la care duce al doilea cod QR (qr/qr-mesaj*.png): un buton mare care pornește mesajul audio al ratonului.
     Mesajul: audio/mesaj-raton.mp3. Dacă fișierul lipsește încă, se aude fanfara (audio/fanfara.mp3), fără nicio mențiune pe pagină. -->
<style>
@font-face{font-family:"Sancreek";src:url(wanted/fonts/sancreek-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Sancreek";src:url(wanted/fonts/sancreek-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02AF}
:root{--mov:#6b3fa0;--mov2:#9b72cf;--ink:#2a1f3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:"Sancreek",Georgia,serif;overflow:hidden;touch-action:manipulation}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:0}
.top{position:relative;width:min(92vw,62vh,560px)}
.top img{display:block;width:100%;transform-origin:50% 100%}
.playing .top img{animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg) translateY(-1.5%)}}
.card{width:min(96vw,66vh,600px);margin-top:-2px;border:7px solid var(--mov);border-radius:28px;padding:5vh 16px 4vh;display:flex;flex-direction:column;align-items:center;gap:2.4vh;position:relative;background:#fff;outline:2px dashed var(--mov);outline-offset:-16px}
h1{margin:0;font-weight:400;font-size:min(4.6vh,7vw,44px);color:var(--mov);text-align:center;line-height:1.1}
#play{width:clamp(120px,22vh,200px);height:clamp(120px,22vh,200px);border-radius:50%;border:6px solid var(--ink);background:var(--mov);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 0 var(--ink);transition:transform .1s,box-shadow .1s;animation:pulse 1.6s ease-in-out infinite}
#play:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
#play svg{width:46%;height:46%;fill:#fff}
.playing #play{animation:none;background:var(--mov2)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
p{margin:0;font-size:clamp(17px,2.8vh,26px);text-align:center}
#bar{width:80%;height:12px;border-radius:6px;background:#eee4f7;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--mov)}
.f{position:fixed;pointer-events:none;fill:var(--mov);opacity:0;animation:fly 2.6s ease-out forwards}
@keyframes fly{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.6)}15%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),-38vh) rotate(var(--r)) scale(1.2)}}
</style>
</head>
<body>
<main>
  <div class="top"><img src="mesaj/raton-casti.jpg" alt="Ratonul Mișșișșippi cu căști"></div>
  <div class="card">
    <h1>Am un mesaj pentru tine!</h1>
    <button id="play" aria-label="Ascultă mesajul"><svg viewBox="0 0 24 24" id="ico"><path d="M8 5v14l11-7z"/></svg></button>
    <p id="txt">Apasă butonul și ascultă!</p>
    <div id="bar"><i></i></div>
  </div>
</main>
<audio id="a" preload="auto" playsinline></audio>
<script>
const MESAJ = 'audio/mesaj-raton.mp3', REZERVA = 'audio/fanfara.mp3';
const a = document.getElementById('a'), btn = document.getElementById('play'), ico = document.getElementById('ico'),
  txt = document.getElementById('txt'), bar = document.querySelector('#bar i');
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUZA = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
const NOTE = ['<path d="M16 4 V36" fill="none" stroke="currentColor" stroke-width="4.5"/><path d="M16 4 Q30 10 30 22 Q26 14 16 13 Z"/><ellipse cx="10.5" cy="37" rx="7.5" ry="5.6" transform="rotate(-22 10.5 37)"/>',
  '<path d="M14 6 L38 1 V33 M14 6 V38" fill="none" stroke="currentColor" stroke-width="4.5"/><path d="M14 6 L38 1 V9 L14 14 Z"/><ellipse cx="8.5" cy="39" rx="7.5" ry="5.6" transform="rotate(-22 8.5 39)"/><ellipse cx="32.5" cy="34" rx="7.5" ry="5.6" transform="rotate(-22 32.5 34)"/>'];

// mesajul ratonului; dacă nu a fost încă pus pe site, fanfara
a.src = MESAJ;
a.addEventListener('error', () => {
  if (a.src.endsWith(MESAJ)) { a.src = REZERVA; }
}, { once: true });

let noteT = null;
function stropNote() {
  const r = btn.getBoundingClientRect();
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 40 48'); s.setAttribute('class', 'f');
  s.innerHTML = NOTE[Math.random() * 2 | 0]; s.style.color = getComputedStyle(document.documentElement).getPropertyValue('--mov');
  const w = 28 + Math.random() * 26;
  Object.assign(s.style, { width: w + 'px', height: w * 1.2 + 'px', left: r.left + r.width * Math.random() + 'px', top: r.top + 'px' });
  s.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px'); s.style.setProperty('--r', (Math.random() * 60 - 30) + 'deg');
  document.body.appendChild(s); setTimeout(() => s.remove(), 2700);
}
function stare(cant) {
  document.body.classList.toggle('playing', cant);
  ico.innerHTML = cant ? PAUZA : PLAY;
  clearInterval(noteT); if (cant) { stropNote(); noteT = setInterval(stropNote, 420); }
}
btn.addEventListener('click', () => {
  if (a.paused) { a.play().then(() => { txt.textContent = 'Ascultă cu atenție...'; }).catch(() => { txt.textContent = 'Mai apasă o dată!'; }); }
  else a.pause();
});
a.addEventListener('play', () => stare(true));
a.addEventListener('pause', () => stare(false));
a.addEventListener('ended', () => { stare(false); bar.style.width = '100%'; txt.textContent = 'Vrei să-l mai asculți? Apasă iar!'; });
a.addEventListener('timeupdate', () => { if (a.duration) bar.style.width = (100 * a.currentTime / a.duration) + '%'; });
</script>
</body>
</html>
